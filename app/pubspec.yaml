name: inkflow
description: 墨脉 InkFlow — 中华传统文化 × AI 学习
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP & networking
  http: ^1.2.0
  # State management
  provider: ^6.1.2
  # Local storage
  shared_preferences: ^2.3.2
  # Routing
  go_router: ^14.2.0
  # Animations
  flutter_animate: ^4.5.0
  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  # Markdown
  flutter_markdown: ^0.7.3
  # Icons
  flutter_svg: ^2.0.10+1
  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
