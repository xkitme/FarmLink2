name: farmlink
description: 田园通 — 数字乡村助农 App
publish_to: 'none'
version: 1.8.0+18

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  intl: ^0.20.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.1.0
  # 离线中文语音识别（sherpa-onnx + 流式 zipformer 中英双语模型，完全本地，无外网）
  sherpa_onnx: ^1.13.3
  record: ^6.2.1
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/generated/
    - assets/images/farmlink-mark.png
    - assets/images/ai_1.jpg
    # 离线 STT（sherpa-onnx 流式 zipformer 中英双语）模型权重 + 词表。
    # *.onnx 因体积(encoder 173MB>GitHub 100MB)未入库，build APK 前需从 _asrdl 解压。
    - assets/models/asr/
