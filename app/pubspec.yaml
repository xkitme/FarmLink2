name: farmlink
description: 田园通 — 数字乡村助农 App
publish_to: 'none'
version: 1.8.0+18

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  intl: ^0.20.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/generated/
    - assets/images/farmlink-mark.png
    - assets/images/ai_1.jpg
