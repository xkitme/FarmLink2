<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>

                        "on-secondary-container": "#795548",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f1f1f1",
                        "tertiary-fixed": "#ffdeac",

                        "on-primary": "#ffffff",

                        "surface-tint": "#1b6d24",
                        "surface-dim": "#dadada",
                        "on-surface-variant": "#40493d",
                        "inverse-primary": "#88d982",
                        "primary-container": "#2e7d32",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#005312",
                        "surface-bright": "#f9f9f9",
                        "on-tertiary-fixed": "#281900",
                        "secondary-container": "#fdcdbc",
                        "surface-container-high": "#e8e8e8",
                        "inverse-surface": "#2f3131",
                        "tertiary-container": "#926500",
                        "on-primary-container": "#cbffc2",
                        "on-primary-fixed": "#002204",
                        "surface": "#f9f9f9",
                        "tertiary-fixed-dim": "#ffba38",
                        "secondary-fixed-dim": "#ebbcac",
                        "on-tertiary-fixed-variant": "#604100",

                        "outline-variant": "#bfcaba",

                        "gutter-mobile": "16px",

                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "label-lg": ["Noto Sans"],
                        "headline-sm": ["Noto Sans"],
                        "headline-lg-mobile": ["Noto Sans"],
                        "label-sm": ["Noto Sans"],
                        "body-md": ["Noto Sans"],
                        "headline-md": ["Noto Sans"],

            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f9f9f9;
            color: #1a1c1c;
            -webkit-tap-highlight-color: transparent;
        }
        .input-focus-ring:focus-within {
            border-color: #2e7d32;
            box-shadow: 0 0 0 1px #2e7d32;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen font-body-md text-body-md">
<!-- TopAppBar (Based on JSON: name: TopAppBar) -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-surface-dim shadow-sm">
<div class="flex items-center px-margin-mobile h-16 w-full max-w-screen-xl mx-auto">
<button aria-label="Go back" class="mr-4 p-2 hover:bg-surface-container-low transition-colors rounded-full active:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm dark:text-on-surface">个人资料</h1>
<div class="ml-auto">
<button class="text-primary font-bold px-4 py-2 hover:bg-surface-container-low transition-colors rounded-lg active:opacity-70">保存</button>
</div>
</div>
</header>
<main class="max-w-md mx-auto px-margin-mobile pt-stack-lg pb-12">
<!-- Avatar Section -->
<section class="flex flex-col items-center mb-10">
<div class="relative group">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-md bg-surface-container">
<img alt="用户头像" class="w-full h-full object-cover" data-alt="A professional close-up portrait of a cheerful middle-aged farmer in a rural setting. He is wearing a clean denim shirt, standing in front of a soft-focus background of lush green fields and golden sunlight. The lighting is warm and natural, emphasizing a mood of reliability and technological vitality, consistent with a modern agricultural corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCW6u3f0yc9C4fwhKSbbKxRRLXznYQckrh8TncA8_eBEdRVeg1q6tF5n1WLRtDyeinXl7ZsJD81CxOhE2bazQOz-1qyS05Sn382TyF_cQIk5cfi8aW5l9vpSSFpuOP3cOPM__2sXxByE3kS_yVwFp98h1VADp-Df-RtF--ZV6vSjMPi4zkTmWXvgf80TZ10gBDpWYxrqNJ8VabdP254ywJSSlbTiF7h8q1ps4CdQBOfRpNMEh_51pXLvMUPGwcRUXPLT37GKXKQOLqg"/>
</div>
<label class="absolute bottom-1 right-1 bg-primary-container text-on-primary-container p-2 rounded-full cursor-pointer shadow-lg active:scale-95 transition-transform" for="avatar-upload">
<span class="material-symbols-outlined" data-icon="photo_camera">photo_camera</span>
<input accept="image/*" class="hidden" id="avatar-upload" type="file"/>
</label>
</div>
<p class="mt-4 font-label-sm text-label-sm text-on-surface-variant">点击图标更换头像</p>
</section>
<!-- Form Fields -->
<div class="space-y-stack-lg">
<!-- 姓名 (Name) -->
<div class="space-y-2">
<label class="block text-label-lg font-label-lg text-on-surface-variant ml-1">姓名</label>
<div class="relative flex items-center bg-white border border-outline-variant rounded-[12px] px-4 py-3 input-focus-ring transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="person">person</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-lg font-body-lg placeholder:text-outline" placeholder="请输入您的姓名" type="text" value="张建国"/>
</div>
</div>
<!-- 性别 (Gender) -->
<div class="space-y-2">
<label class="block text-label-lg font-label-lg text-on-surface-variant ml-1">性别</label>
<div class="grid grid-cols-2 gap-4">
<label class="flex items-center justify-center space-x-2 bg-white border-2 border-primary-container rounded-[12px] py-3 cursor-pointer">
<input checked="" class="hidden" name="gender" type="radio" value="male"/>
<span class="material-symbols-outlined text-primary-container" data-icon="male">male</span>
<span class="font-label-lg text-primary-container">男</span>
</label>
<label class="flex items-center justify-center space-x-2 bg-white border border-outline-variant rounded-[12px] py-3 cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="hidden" name="gender" type="radio" value="female"/>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="female">female</span>
<span class="font-label-lg text-on-surface-variant">女</span>
</label>
</div>
</div>
<!-- 手机号 (Phone Number) -->
<div class="space-y-2">
<label class="block text-label-lg font-label-lg text-on-surface-variant ml-1">手机号</label>
<div class="relative flex items-center bg-white border border-outline-variant rounded-[12px] px-4 py-3 input-focus-ring transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="call">call</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-lg font-body-lg" placeholder="请输入手机号" type="tel" value="138-0000-0000"/>
</div>
</div>
<!-- 农场名称 (Farm Name) -->
<div class="space-y-2">
<label class="block text-label-lg font-label-lg text-on-surface-variant ml-1">农场名称</label>
<div class="relative flex items-center bg-white border border-outline-variant rounded-[12px] px-4 py-3 input-focus-ring transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="agriculture">agriculture</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-lg font-body-lg" placeholder="请输入农场名称" type="text" value="绿源智慧农场"/>
</div>
</div>
<!-- 主要作物 (Main Crops) -->
<div class="space-y-2">
<label class="block text-label-lg font-label-lg text-on-surface-variant ml-1">主要作物</label>
<div class="relative flex flex-wrap gap-2 bg-white border border-outline-variant rounded-[12px] px-4 py-3 input-focus-ring transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-1" data-icon="eco">eco</span>
<div class="flex flex-wrap gap-2 flex-1">
<span class="inline-flex items-center bg-primary-fixed text-on-primary-fixed px-3 py-1 rounded-full text-label-sm font-label-sm">
                            小麦 <button class="ml-1 material-symbols-outlined text-[16px]" data-icon="close">close</button>
</span>
<span class="inline-flex items-center bg-primary-fixed text-on-primary-fixed px-3 py-1 rounded-full text-label-sm font-label-sm">
                            玉米 <button class="ml-1 material-symbols-outlined text-[16px]" data-icon="close">close</button>
</span>
<input class="flex-1 bg-transparent border-none p-0 focus:ring-0 text-body-lg font-body-lg min-w-[80px]" placeholder="添加..." type="text"/>
</div>
</div>
</div>
</div>
<!-- Danger Zone -->
<div class="mt-12 pt-8 border-t border-outline-variant">
<button class="w-full flex items-center justify-center space-x-2 text-error py-4 rounded-[12px] hover:bg-error-container/20 transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
<span class="font-label-lg">退出当前账号</span>
</button>
</div>
</main>
<script>
        // Simple micro-interaction for gender selection toggle
        const genderOptions = document.querySelectorAll('input[name="gender"]');
        genderOptions.forEach(option => {
            option.parentElement.addEventListener('click', () => {
                genderOptions.forEach(opt => {
                    opt.parentElement.classList.remove('border-primary-container', 'border-2');
                    opt.parentElement.classList.add('border-outline-variant', 'border');
                    const icon = opt.parentElement.querySelector('.material-symbols-outlined');
                    const label = opt.parentElement.querySelector('span:not(.material-symbols-outlined)');
                    icon.classList.remove('text-primary-container');
                    icon.classList.add('text-on-surface-variant');
                    label.classList.remove('text-primary-container');
                    label.classList.add('text-on-surface-variant');
                });
                
                const parent = option.parentElement;
                parent.classList.add('border-primary-container', 'border-2');
                parent.classList.remove('border-outline-variant', 'border');
                const icon = parent.querySelector('.material-symbols-outlined');
                const label = parent.querySelector('span:not(.material-symbols-outlined)');
                icon.classList.add('text-primary-container');
                icon.classList.remove('text-on-surface-variant');
                label.classList.add('text-primary-container');
                label.classList.remove('text-on-surface-variant');
                option.checked = true;
            });
        });

        // Click effect for "Save" button
        document.querySelector('header button.text-primary').addEventListener('click', function() {
            this.textContent = "已保存";
            this.classList.remove('text-primary');
            this.classList.add('text-on-surface-variant');
            setTimeout(() => {
                this.textContent = "保存";
                this.classList.add('text-primary');
                this.classList.remove('text-on-surface-variant');
            }, 2000);
        });
    </script>
</body></html>
