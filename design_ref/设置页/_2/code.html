<script>
        function checkUpdate() {
            const btn = event.currentTarget;
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerHTML = '<span class="flex items-center gap-2"><span class="animate-spin material-symbols-outlined text-[18px]">progress_activity</span> 检查中...</span>';
            
            setTimeout(() => {
                btn.innerHTML = '已是最新版本';
                btn.classList.replace('bg-primary', 'bg-surface-variant');
                btn.classList.replace('text-on-primary', 'text-on-surface-variant');
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    btn.classList.replace('bg-surface-variant', 'bg-primary');
                    btn.classList.replace('text-on-surface-variant', 'text-on-primary');
                }, 3000);
            }, 1500);
        }
    </script>
